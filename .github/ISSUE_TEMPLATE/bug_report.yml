name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Frontend, Backend, AI chat assistant, Reminders and email, Database or migrations, Docs, Not sure]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, browser, Node and Python versions
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets or personal data first.
