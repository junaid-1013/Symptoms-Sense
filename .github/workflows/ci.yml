name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # The job name is what the branch ruleset requires; keep it in sync with docs/BRANCH_PROTECTION.md.
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000/api/

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      # Dummy values: the suite uses SQLite and fake OpenAI clients, so nothing real is contacted.
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-only-not-a-real-secret
      OPENAI_API_KEY: ci-only-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Byte-compile the app
        run: python -m compileall -q app
      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests -q
          else
            echo "No tests directory found; skipping."
          fi
